
name: API Continuous Integration and Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Run automated tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: Run API unit tests
        run: python -m pytest tests/test_api.py -q

      - name: Build Docker image
        run: docker build -f Dockerfile.api -t support-api:test .

      - name: Start API container
        run: docker run -d --name support-api-ci -p 8001:8000 support-api:test

      - name: Wait for API to become ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs support-api-ci
          exit 1

      - name: Run Docker integration tests
        run: python -m pytest tests/test_container_api.py -q

  # Job 2: Publish tested Docker image to GHCR
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/saudkhan435/ai-support-quality-platform:latest
            ghcr.io/saudkhan435/ai-support-quality-platform:${{ github.sha }}

  # Job 3: Deploy the new image to Azure Container Apps
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name ai-support-api \
            --resource-group rg-ai-support-quality \
            --image ghcr.io/saudkhan435/ai-support-quality-platform:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 1
